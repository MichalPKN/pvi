- notebook: colors
  testfile: test_colors
  deadline: 2026-11-01
  tests:
    - name: TestLoadImage
      points: 1
      params:
        rgb: rgb
    - name: TestBboxAndCentroid
      points: 2
      params:
        bbox_and_centroid_fn: bbox_and_centroid
    - name: TestSegmentationRGB
      points: 5

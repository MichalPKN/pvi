[project]
name = "pvi-2026"
version = "0.1.0"
description = "Computer Vision Course Setup"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "easyocr>=1.7.2",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.0.6",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.uv]
override-dependencies = [
    "opencv-python-headless>=0; sys_platform == 'never'",
    "opencv-python>=0; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'cuda'" },
]
torchvision = [
    { index = "pytorch-cu132", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'cuda'" },
]

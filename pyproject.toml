[project]
name = "pvi-2026"
version = "0.1.0"
description = "Computer Vision Course Setup"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "easyocr",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "matplotlib",
    "numpy",
    "opencv-contrib-python",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.uv]
override-dependencies = [
    "opencv-python-headless>=0; sys_platform == 'never'",
    "opencv-python>=0; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'cuda'" },
]
torchvision = [
    { index = "pytorch-cu132", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'cuda'" },
]
